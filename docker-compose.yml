services:
    api:
        build: .
        container_name: ayico_api
        restart: unless-stopped
        env_file: .env
        ports:
            - "3000:3000"
        networks:
            - backend
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    backend:
        external: true
        name: backend
